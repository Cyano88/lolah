name: Verify Lolah

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run contract:compile
      - uses: actions/upload-artifact@v7
        with:
          name: lolah-xlayer-contract
          path: artifacts/LolahSignalProofRegistry.json
          if-no-files-found: error
          retention-days: 14
