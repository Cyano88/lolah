services:
  - type: worker
    name: lolah-upbit
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm ci
    startCommand: npm run upbit:worker
    autoDeploy: true
    disk:
      name: lolah-upbit-data
      mountPath: /var/lib/lolah
      sizeGB: 1
    envVars:
      - key: LOLAH_UPBIT_STATE_PATH
        value: /var/lib/lolah/upbit-state.json
      - key: LOLAH_UPBIT_SOURCE
        value: coinlisting
      - key: LOLAH_COINLISTING_ENDPOINT
        value: wss://seoul.coinlisting.pro/feed
      - key: LOLAH_COINLISTING_KEY
        sync: false
      - key: LOLAH_UPBIT_ENRICHMENT_ENABLED
        value: 'false'
      - key: LOLAH_POLYDESK_CONTEXT_ENDPOINT
        value: https://polydesk.trade/api/agent/polymarket-context
      - key: LOLAH_POLYDESK_CONTEXT_TOKEN
        sync: false

  - type: worker
    name: lolah-x-intelligence
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm ci
    startCommand: npm run x:worker
    autoDeploy: true
    disk:
      name: lolah-x-data
      mountPath: /var/lib/lolah-x
      sizeGB: 1
    envVars:
      - key: LOLAH_X_ENABLED
        value: 'false'
      - key: LOLAH_X_STATE_PATH
        value: /var/lib/lolah-x/state.json
      - key: LOLAH_X_DAILY_POST_CAP
        value: '50'
      - key: LOLAH_X_USAGE_PATH
        value: /var/lib/lolah-x/x-usage.json
      - key: LOLAH_X_BEARER_TOKEN
        sync: false
      - key: LOLAH_X_SOURCE_CATALOG_PATH
        value: config/x-source-catalog.json
      - key: LOLAH_X_SOURCE_PIN_PATH
        value: /var/lib/lolah-x/source-registry-pin.json
      - key: LOLAH_POLYDESK_CONTEXT_ENDPOINT
        value: https://polydesk.trade/api/agent/polymarket-context
      - key: LOLAH_POLYDESK_CONTEXT_TOKEN
        sync: false
