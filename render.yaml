services:
  - type: worker
    name: lolah-upbit
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm ci
    startCommand: npm run upbit:worker
    autoDeploy: true
    disk:
      name: lolah-upbit-data
      mountPath: /var/lib/lolah
      sizeGB: 1
    envVars:
      - key: LOLAH_UPBIT_STATE_PATH
        value: /var/lib/lolah/upbit-state.json
      - key: LOLAH_UPBIT_SOURCE
        value: signed_relay
      - key: LOLAH_UPBIT_RELAY_URL
        sync: false
      - key: LOLAH_UPBIT_RELAY_PUBLIC_KEY_SPKI_BASE64
        sync: false
