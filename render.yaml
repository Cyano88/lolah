services:
  - type: worker
    name: lolah-upbit
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm ci
    startCommand: npm run upbit:worker
    autoDeploy: true
    disk:
      name: lolah-upbit-data
      mountPath: /var/lib/lolah
      sizeGB: 1
    envVars:
      - key: LOLAH_UPBIT_STATE_PATH
        value: /var/lib/lolah/upbit-state.json
      - key: LOLAH_UPBIT_SOURCE
        value: coinlisting
      - key: LOLAH_COINLISTING_ENDPOINT
        value: wss://seoul.coinlisting.pro/feed
      - key: LOLAH_COINLISTING_KEY
        sync: false
      - key: LOLAH_UPBIT_ENRICHMENT_ENABLED
        value: 'false'
      - key: LOLAH_POLYDESK_CONTEXT_ENDPOINT
        value: https://polydesk.trade/api/agent/polymarket-context
